name = "outlook-imap-graph-api"
main = "src/graph-worker.js"
compatibility_date = "2026-07-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "mail.chatai.codes"
custom_domain = true

[[migrations]]
tag = "remove-container-v1"
deleted_classes = ["OutlookImapGraphApi"]
